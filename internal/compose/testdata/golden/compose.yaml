# A small shop: a web front end, an API, and the API's database. The
# database is published on the node's private address, DB_ADDR, which the
# API's container can reach; 127.0.0.1 inside a container is the container.
name: shop

x-restart: &restart
  restart: unless-stopped

x-api-env: &api-env
  LOG_LEVEL: info
  DB_HOST: ${DB_ADDR}

services:
  web:
    <<: *restart
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3

  api:
    <<: *restart
    image: ghcr.io/example/shop-api:${API_TAG:-2.4.1}
    command: serve --listen :9000 --db "postgres://shop@${DB_ADDR}:5432/shop"
    environment:
      <<: *api-env
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      WORKERS: 4
    ports:
      - target: 9000
        published: 9000
        host_ip: 0.0.0.0
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  db:
    <<: *restart
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shop
    ports:
      - "${DB_ADDR}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U shop
      interval: 10s
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 1g

volumes:
  pgdata:
